name: Validate Skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          echo "Checking all JSON files..."
          failed=0
          while IFS= read -r f; do
            if ! python3 -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "::error file=$f::Invalid JSON"
              failed=1
            fi
          done < <(find . -name "*.json" -not -path "./.git/*")
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "All JSON files valid"

      # Spec frontmatter, phase-scheme consistency, retired-tool sweep,
      # local symlink integrity, Claude package contents, and generated drift.
      - name: Validate skills + check generated distributions
        run: python3 scripts/build-distributions.py --check

      - name: Validate island example contracts
        run: python3 scripts/validate-island-contracts.py

      - name: Test storefront skill workflows
        run: python3 -m unittest discover -s tests -p 'test_*.py'
